<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="edgeViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="edgeCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="edgeEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="edgeAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="18" fill="url(#bg4)"/>

  <!-- Header -->
  <text x="600" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="27" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
    GRAPH-FIRST BLAST RADIUS vs. BLIND GREP LOOPS
  </text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8">
    One deterministic call (<tspan font-family="monospace" fill="#38bdf8">neurostrata_memories_for_file</tspan>) returns governing rules, AST callers, callees, and past failures
  </text>

  <!-- Left Summary Box: What 1 Call Returns -->
  <g transform="translate(36, 106)">
    <rect width="340" height="474" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <rect width="340" height="42" rx="14" fill="#1e293b"/>
    <text x="170" y="26" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8">
      memories_for_file("src/server.rs")
    </text>

    <g transform="translate(20, 62)">
      <rect width="300" height="84" rx="10" fill="#17153b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#a5b4fc">1. GOVERNING RULES (GOVERNS)</text>
      <text x="14" y="44" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Surfaces every active <tspan font-family="monospace" fill="#c7d2fe">[rule]</tspan> and</text>
      <text x="14" y="61" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1"><tspan font-family="monospace" fill="#c7d2fe">[guard_rule]</tspan> anchored to the file or symbol</text>
      <text x="14" y="76" font-family="system-ui, sans-serif" font-size="11" fill="#818cf8">Zero embedding cost · 100% deterministic</text>
    </g>

    <g transform="translate(20, 160)">
      <rect width="300" height="84" rx="10" fill="#0c2636" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#67e8f9">2. UPSTREAM CALLERS &amp; IMPORTERS</text>
      <text x="14" y="44" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Tree-sitter AST <tspan font-family="monospace" fill="#a5f3fc">calls</tspan> and <tspan font-family="monospace" fill="#a5f3fc">imports</tspan> edges</text>
      <text x="14" y="61" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">show every module that will break if you</text>
      <text x="14" y="76" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">change a function signature.</text>
    </g>

    <g transform="translate(20, 258)">
      <rect width="300" height="84" rx="10" fill="#0b2922" stroke="#34d399" stroke-width="1.2"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#6ee7b7">3. DOWNSTREAM CALLEES &amp; SYMBOLS</text>
      <text x="14" y="44" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Lists functions, structs, traits &amp; line</text>
      <text x="14" y="61" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">spans inside the file plus its outgoing</text>
      <text x="14" y="76" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1"><tspan font-family="monospace" fill="#a7f3d0">DEPENDS_ON</tspan> targets.</text>
    </g>

    <g transform="translate(20, 356)">
      <rect width="300" height="94" rx="10" fill="#2b1610" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="14" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fcd34d">4. FAILED ATTEMPTS &amp; TASK PROVENANCE</text>
      <text x="14" y="44" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">Surfaces <tspan font-family="monospace" fill="#fde68a">EXTRACTED_FROM</tspan> task history</text>
      <text x="14" y="61" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">and Negative Exemplars (<tspan font-family="monospace" fill="#fca5a5">outcome:"failed"</tspan>)</text>
      <text x="14" y="78" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">so dead-end refactors are never repeated.</text>
    </g>
  </g>

  <!-- Right Graph Visualization Canvas -->
  <g transform="translate(400, 106)">
    <rect width="764" height="474" rx="14" fill="#0d1322" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Blast Radius Rings -->
    <circle cx="382" cy="240" r="195" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,6"/>
    <circle cx="382" cy="240" r="115" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="382" y="36" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b">
      ast_summary: { blast_radius_count: 14, callers: 4, callees: 5, rules: 3, exemplars: 2 }
    </text>

    <!-- Directed Graph Edges -->
    <!-- Governing Rules -> Target File -->
    <line x1="175" y1="115" x2="310" y2="205" stroke="#818cf8" stroke-width="2.5" marker-end="url(#edgeViolet)"/>
    <text x="225" y="148" font-family="monospace" font-size="11" fill="#a5b4fc" transform="rotate(-12, 225, 148)">GOVERNS</text>

    <!-- Upstream Callers -> Target File -->
    <line x1="590" y1="115" x2="455" y2="205" stroke="#22d3ee" stroke-width="2.5" marker-end="url(#edgeCyan)"/>
    <text x="515" y="148" font-family="monospace" font-size="11" fill="#67e8f9" transform="rotate(12, 515, 148)">calls / imports</text>

    <!-- Target File -> Downstream Callees -->
    <line x1="455" y1="275" x2="590" y2="365" stroke="#34d399" stroke-width="2.5" marker-end="url(#edgeEmerald)"/>
    <text x="515" y="335" font-family="monospace" font-size="11" fill="#6ee7b7" transform="rotate(-12, 515, 335)">DEPENDS_ON</text>

    <!-- Target File -> Negative Exemplar / Task History -->
    <line x1="310" y1="275" x2="175" y2="365" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#edgeAmber)"/>
    <text x="195" y="335" font-family="monospace" font-size="11" fill="#fcd34d" transform="rotate(12, 195, 335)">EXTRACTED_FROM</text>

    <!-- CENTER NODE: TARGET FILE -->
    <g transform="translate(287, 196)">
      <rect width="190" height="88" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <text x="95" y="28" text-anchor="middle" font-family="monospace" font-size="14" font-weight="800" fill="#f8fafc">
        src/server.rs
      </text>
      <text x="95" y="48" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">
        fn handle_get_snapshot()
      </text>
      <rect x="22" y="58" width="146" height="20" rx="10" fill="#083344"/>
      <text x="95" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#67e8f9">
        TARGET EDIT NODE
      </text>
    </g>

    <!-- TOP-LEFT NODE: GOVERNING ARCHITECTURAL RULES -->
    <g transform="translate(32, 62)">
      <rect width="235" height="90" rx="12" fill="#17153b" stroke="#818cf8" stroke-width="2"/>
      <text x="16" y="25" font-family="monospace" font-size="11.5" font-weight="700" fill="#a5b4fc">[GOLDEN rule] d104c715</text>
      <text x="16" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#e0e7ff">Always surface Golden Rules</text>
      <text x="16" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#e0e7ff">above top-5 access_count cut</text>
      <text x="16" y="79" font-family="monospace" font-size="10.5" fill="#818cf8">pinned: true · enforced</text>
    </g>

    <!-- TOP-RIGHT NODE: UPSTREAM CALLERS -->
    <g transform="translate(497, 62)">
      <rect width="235" height="90" rx="12" fill="#0c2636" stroke="#22d3ee" stroke-width="2"/>
      <text x="16" y="25" font-family="monospace" font-size="11.5" font-weight="700" fill="#67e8f9">[code_ast] Upstream Callers</text>
      <text x="16" y="45" font-family="monospace" font-size="11.5" fill="#ecfeff">• src/daemon.rs::dispatch_rpc</text>
      <text x="16" y="63" font-family="monospace" font-size="11.5" fill="#ecfeff">• plugins/core/index.ts</text>
      <text x="16" y="79" font-family="system-ui, sans-serif" font-size="10.5" fill="#22d3ee">Breakage risk caught pre-edit</text>
    </g>

    <!-- BOTTOM-LEFT NODE: NEGATIVE EXEMPLAR & PROVENANCE -->
    <g transform="translate(32, 342)">
      <rect width="235" height="94" rx="12" fill="#2b1610" stroke="#fbbf24" stroke-width="2"/>
      <text x="16" y="25" font-family="monospace" font-size="11.5" font-weight="700" fill="#fcd34d">[fact] Negative Exemplar</text>
      <text x="16" y="45" font-family="system-ui, sans-serif" font-size="11.5" fill="#fef3c7">✗ Sync container wait hung MCP</text>
      <text x="16" y="62" font-family="system-ui, sans-serif" font-size="11.5" fill="#fef3c7">✓ Use async wake + JSONL cache</text>
      <text x="16" y="80" font-family="monospace" font-size="10.5" fill="#fbbf24">attempt.outcome = "failed"</text>
    </g>

    <!-- BOTTOM-RIGHT NODE: DOWNSTREAM CALLEES -->
    <g transform="translate(497, 342)">
      <rect width="235" height="94" rx="12" fill="#0b2922" stroke="#34d399" stroke-width="2"/>
      <text x="16" y="25" font-family="monospace" font-size="11.5" font-weight="700" fill="#6ee7b7">[code_ast] Downstream Callees</text>
      <text x="16" y="45" font-family="monospace" font-size="11.5" fill="#d1fae5">• src/task/mod.rs::collect_golden</text>
      <text x="16" y="63" font-family="monospace" font-size="11.5" fill="#d1fae5">• src/task/wiring.rs::check_delta</text>
      <text x="16" y="80" font-family="monospace" font-size="10.5" fill="#34d399">• src/storage.rs::query_stratum</text>
    </g>
  </g>
</svg>
