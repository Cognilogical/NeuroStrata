<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hubRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="760" rx="18" fill="url(#bg2)"/>
  <circle cx="600" cy="405" r="280" fill="url(#coreGlow)"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" letter-spacing="0.6">
    ONE MCP INTERFACE, SIX WAYS TO THINK
  </text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" fill="#94a3b8">
    One unified MCP interface gives every AI agent memory, codebase awareness, logic, task locks, team sync &amp; safety
  </text>

  <!-- Connecting Synaptic Lines from Center (600, 405) to 6 Cards -->
  <g stroke-width="2.5" stroke-dasharray="6,4" fill="none">
    <path d="M 495 350 L 414 215" stroke="#818cf8"/>
    <path d="M 488 405 L 414 405" stroke="#22d3ee"/>
    <path d="M 495 460 L 414 595" stroke="#fbbf24"/>
    <path d="M 705 350 L 786 215" stroke="#34d399"/>
    <path d="M 712 405 L 786 405" stroke="#f472b6"/>
    <path d="M 705 460 L 786 595" stroke="#fb7185"/>
  </g>

  <!-- CENTRAL HUB: NEUROSTRATA CORE -->
  <g transform="translate(600, 405)">
    <circle r="112" fill="#0f172a" stroke="url(#hubRing)" stroke-width="3"/>
    <circle r="100" fill="#111827" stroke="#334155" stroke-width="1"/>

    <!-- Stylized 5-Strata Logo Emblem in Color -->
    <g transform="translate(0, -22)">
      <g stroke="#475569" stroke-width="1.4">
        <line x1="-45" y1="-32" x2="0" y2="0"/>
        <line x1="45" y1="-32" x2="0" y2="0"/>
        <line x1="-55" y1="0" x2="0" y2="-45"/>
        <line x1="55" y1="0" x2="0" y2="-45"/>
        <line x1="-45" y1="32" x2="0" y2="0"/>
        <line x1="45" y1="32" x2="0" y2="0"/>
        <line x1="-30" y1="-45" x2="30" y2="45"/>
        <line x1="30" y1="-45" x2="-30" y2="45"/>
      </g>
      <line x1="-46" y1="-32" x2="46" y2="-32" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
      <line x1="-56" y1="-16" x2="56" y2="-16" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
      <line x1="-62" y1="0" x2="62" y2="0" stroke="#34d399" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="-56" y1="16" x2="56" y2="16" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
      <line x1="-46" y1="32" x2="46" y2="32" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>

      <circle cx="0" cy="-46" r="5" fill="#818cf8"/>
      <circle cx="-26" cy="-32" r="5" fill="#818cf8"/>
      <circle cx="26" cy="-32" r="5" fill="#818cf8"/>
      <circle cx="-38" cy="-16" r="5" fill="#22d3ee"/>
      <circle cx="38" cy="-16" r="5" fill="#22d3ee"/>
      <circle cx="0" cy="0" r="11" fill="#34d399" stroke="#0f172a" stroke-width="2"/>
      <circle cx="-38" cy="16" r="5" fill="#fbbf24"/>
      <circle cx="38" cy="16" r="5" fill="#fbbf24"/>
      <circle cx="-26" cy="32" r="5" fill="#f472b6"/>
      <circle cx="26" cy="32" r="5" fill="#f472b6"/>
      <circle cx="0" cy="46" r="5" fill="#fb7185"/>
    </g>

    <text x="0" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800" fill="#f8fafc">
      One MCP Interface
    </text>
    <text x="0" y="67" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">
      Memory · Code Graph · Logic
    </text>
    <text x="0" y="83" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">
      Tasks · Subagents · Sandbox
    </text>
  </g>

  <!-- ORGAN 1: TOP LEFT — ASSOCIATIVE & EXPERIENTIAL MEMORY (INDIGO) -->
  <g transform="translate(24, 115)">
    <rect width="390" height="175" rx="14" fill="#131836" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="390" height="36" rx="14" fill="#1e1b4b"/>
    <text x="18" y="23" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#a5b4fc" letter-spacing="0.4">
      1. ASSOCIATIVE &amp; EXPERIENTIAL MEMORY
    </text>
    <text x="18" y="56" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#e0e7ff">
      Tri-Strata Isolation + 3 Retrieval Surfaces
    </text>
    <text x="18" y="78" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#a5b4fc" font-weight="600">3 Strata:</tspan> Global, Project &amp; Task Working Memory
    </text>
    <text x="18" y="98" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#a5b4fc" font-weight="600">3 Surfaces:</tspan> HNSW Vector, Tantivy FTS, or BM25
    </text>
    <text x="18" y="118" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#a5b4fc" font-weight="600">Negative Exemplars:</tspan> Logs <tspan font-family="monospace" font-size="10.5">outcome:"failed"</tspan> runs
    </text>
    <text x="18" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#a5b4fc" font-weight="600">Procedures:</tspan> Habit budgets via <tspan font-family="monospace" font-size="10.5">procedure_perform</tspan>
    </text>
    <rect x="18" y="149" width="354" height="19" rx="4" fill="#0f172a"/>
    <text x="195" y="162" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#818cf8">
      get_snapshot · search_memory · add_memory
    </text>
  </g>

  <!-- ORGAN 2: MID LEFT — STRUCTURAL & BLAST-RADIUS THINKING (CYAN) -->
  <g transform="translate(24, 318)">
    <rect width="390" height="175" rx="14" fill="#0b2230" stroke="#06b6d4" stroke-width="2"/>
    <rect x="0" y="0" width="390" height="36" rx="14" fill="#083344"/>
    <text x="18" y="23" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#67e8f9" letter-spacing="0.4">
      2. STRUCTURAL &amp; BLAST-RADIUS THINKING
    </text>
    <text x="18" y="56" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#cffafe">
      Multi-Language Tree-sitter AST + Rule Graph
    </text>
    <text x="18" y="78" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#67e8f9" font-weight="600">6 Languages:</tspan> Rust, TS, TSX, Go, Java &amp; Scripts
    </text>
    <text x="18" y="98" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#67e8f9" font-weight="600">Typed Edges:</tspan> <tspan font-family="monospace" font-size="10.5">GOVERNS</tspan>, <tspan font-family="monospace" font-size="10.5">DEPENDS_ON</tspan>, <tspan font-family="monospace" font-size="10.5">calls</tspan>, <tspan font-family="monospace" font-size="10.5">imports</tspan>
    </text>
    <text x="18" y="118" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#67e8f9" font-weight="600">Blast Radius:</tspan> Callers, callees &amp; rules in 1 call
    </text>
    <text x="18" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#67e8f9" font-weight="600">Graph Ledger:</tspan> Pre-commit verifies lookup first
    </text>
    <rect x="18" y="149" width="354" height="19" rx="4" fill="#0f172a"/>
    <text x="195" y="162" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#22d3ee">
      memories_for_file · related · ingest_directory
    </text>
  </g>

  <!-- ORGAN 3: BOTTOM LEFT — DEDUCTIVE & SEMANTIC THINKING (AMBER) -->
  <g transform="translate(24, 520)">
    <rect width="390" height="175" rx="14" fill="#271c0c" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="390" height="36" rx="14" fill="#451a03"/>
    <text x="18" y="23" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#fcd34d" letter-spacing="0.4">
      3. DEDUCTIVE W3C &amp; FORMAL LOGIC
    </text>
    <text x="18" y="56" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#fef3c7">
      Exact Symbolic Queries + Lean 4 Proofs
    </text>
    <text x="18" y="78" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#fcd34d" font-weight="600">SPARQL 1.1:</tspan> <tspan font-family="monospace" font-size="10.5">SELECT</tspan>, <tspan font-family="monospace" font-size="10.5">ASK</tspan> &amp; <tspan font-family="monospace" font-size="10.5">CONSTRUCT</tspan> queries
    </text>
    <text x="18" y="98" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#fcd34d" font-weight="600">RDFS/OWL Closure:</tspan> Transitive subclass reasoning
    </text>
    <text x="18" y="118" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#fcd34d" font-weight="600">SHACL Shapes:</tspan> Closed-world write validation
    </text>
    <text x="18" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#fcd34d" font-weight="600">Lean 4 Kernel:</tspan> Machine-checked gate theorems
    </text>
    <rect x="18" y="149" width="354" height="19" rx="4" fill="#0f172a"/>
    <text x="195" y="162" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#fbbf24">
      sparql_query · shacl.rs · formal_kernel.rs
    </text>
  </g>

  <!-- ORGAN 4: TOP RIGHT — EXECUTIVE & WORKFLOW THINKING (EMERALD) -->
  <g transform="translate(786, 115)">
    <rect width="390" height="175" rx="14" fill="#0b2620" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="390" height="36" rx="14" fill="#064e3b"/>
    <text x="18" y="23" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#6ee7b7" letter-spacing="0.4">
      4. EXECUTIVE &amp; WORKFLOW THINKING
    </text>
    <text x="18" y="56" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#d1fae5">
      Central Executive + 3 Resilient Soft Locks
    </text>
    <text x="18" y="78" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#6ee7b7" font-weight="600">Zero-Action Start:</tspan> Blocks edits until task claimed
    </text>
    <text x="18" y="98" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#6ee7b7" font-weight="600">Lock 3 (Breath):</tspan> Checkpoints state every 3–5 steps
    </text>
    <text x="18" y="118" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#6ee7b7" font-weight="600">Lock 2 (Done-Funnel):</tspan> Requires memory extraction
    </text>
    <text x="18" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#6ee7b7" font-weight="600">Lock 1 (Pre-Push):</tspan> Git gate blocks incomplete work
    </text>
    <rect x="18" y="149" width="354" height="19" rx="4" fill="#0f172a"/>
    <text x="195" y="162" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#34d399">
      task_create · task_claim · task_complete
    </text>
  </g>

  <!-- ORGAN 5: MID RIGHT — COLLECTIVE & SUBAGENT THINKING (PINK) -->
  <g transform="translate(786, 318)">
    <rect width="390" height="175" rx="14" fill="#281126" stroke="#ec4899" stroke-width="2"/>
    <rect x="0" y="0" width="390" height="36" rx="14" fill="#500724"/>
    <text x="18" y="23" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#f9a8d4" letter-spacing="0.4">
      5. COLLECTIVE &amp; SUBAGENT THINKING
    </text>
    <text x="18" y="56" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#fce7f3">
      Auto-Injected Subagent Context + SynapticMesh
    </text>
    <text x="18" y="78" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#f9a8d4" font-weight="600">Subagent Injection:</tspan> Prepends rules + AST to children
    </text>
    <text x="18" y="98" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#f9a8d4" font-weight="600">6 CLI Harnesses:</tspan> OpenCode, Claude, Hermes, Codex+
    </text>
    <text x="18" y="118" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#f9a8d4" font-weight="600">SynapticMesh:</tspan> Team sync via <tspan font-family="monospace" font-size="10.5">git pull --ff-only</tspan>
    </text>
    <text x="18" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#f9a8d4" font-weight="600">Sovereign Privacy:</tspan> Private rows never leave disk
    </text>
    <rect x="18" y="149" width="354" height="19" rx="4" fill="#0f172a"/>
    <text x="195" y="162" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#f472b6">
      subagent_prompt_injection · synaptic_mesh_sync
    </text>
  </g>

  <!-- ORGAN 6: BOTTOM RIGHT — PREDICTIVE & CONSCIENCE THINKING (CORAL/ROSE) -->
  <g transform="translate(786, 520)">
    <rect width="390" height="175" rx="14" fill="#2b1219" stroke="#fb7185" stroke-width="2"/>
    <rect x="0" y="0" width="390" height="36" rx="14" fill="#4c0519"/>
    <text x="18" y="23" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" fill="#fda4af" letter-spacing="0.4">
      6. PREDICTIVE &amp; CONSCIENCE THINKING
    </text>
    <text x="18" y="56" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#ffe4e6">
      Prefrontal Sandbox + Digital Twins + Telemetry
    </text>
    <text x="18" y="78" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#fda4af" font-weight="600">Prefrontal Guard:</tspan> Checks <tspan font-family="monospace" font-size="10.5">guard_rule</tspan> constraints
    </text>
    <text x="18" y="98" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#fda4af" font-weight="600">Podman Dry-Run:</tspan> Rootless <tspan font-family="monospace" font-size="10.5">--network=none</tspan> sandbox
    </text>
    <text x="18" y="118" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#fda4af" font-weight="600">Digital Twins:</tspan> Versioned state &amp; structural diffs
    </text>
    <text x="18" y="138" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
      • <tspan fill="#fda4af" font-weight="600">Laya Judge:</tspan> Local duplicate/conflict detector
    </text>
    <rect x="18" y="149" width="354" height="19" rx="4" fill="#0f172a"/>
    <text x="195" y="162" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#fb7185">
      guard_validate · twin_diff · metrics_query
    </text>
  </g>

  <!-- Bottom Banner -->
  <rect x="200" y="712" width="800" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="733" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
    ⚡ 100% Automated Lifecycle: Setup, Plugin Wiring, Git Hooks &amp; Version Upgrades Happen Automatically
  </text>
</svg>
