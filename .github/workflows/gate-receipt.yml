name: gate-receipt

# GitHub Actions has no review-thread-resolution trigger:
# `pull_request_review_thread` is a webhook event only, and listing it under
# `on:` makes the workflow invalid. A bare resolve/unresolve therefore
# re-evaluates on the next review, inline comment, or PR edit. A
# `fixed@`/`filed`/`ruled:` reply is an inline comment, so the receipt path
# re-runs the check without an unrelated push.
#
# No privileged-context triggers (`issue_comment`, `workflow_dispatch`) are
# subscribed here: they would execute a PR-supplied checkout in a context with
# default-branch authority. Use a review/inline reply (or a push) to re-run.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate-receipt:
    name: gate-receipt
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Bootstrap: this workflow lands in the PR that adds the script, so PR and
      # review events run the head. After this lands, switch that checkout to
      # the base ref so a PR cannot edit the gate that checks it.
      - name: Checkout the PR head
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require a receipt for every gating marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gate-receipt.sh --pr "${{ github.event.pull_request.number }}"
