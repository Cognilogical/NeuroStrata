name: gate-receipt

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate-receipt:
    name: gate-receipt
    runs-on: ubuntu-latest
    steps:
      # Bootstrap: this workflow lands in the PR that adds the script, so the
      # first run must use the head. After this lands, pin to base.ref so a PR
      # cannot edit the gate that checks it.
      - name: Checkout PR head (bootstrap; pin to base after merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require a receipt for every gating marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gate-receipt.sh --pr "${{ github.event.pull_request.number }}"
