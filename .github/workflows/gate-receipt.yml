name: gate-receipt

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate-receipt:
    name: gate-receipt
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Bootstrap: this workflow lands in the PR that adds the script, so the
      # first run must use the head. After this lands, pin to base.ref so a PR
      # cannot edit the gate that checks it.
      - name: Resolve the PR head for comment events
        id: resolve
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head (bootstrap; pin to base after merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || steps.resolve.outputs.sha }}

      - name: Require a receipt for every gating marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gate-receipt.sh --pr "${{ github.event.pull_request.number || github.event.issue.number }}"
