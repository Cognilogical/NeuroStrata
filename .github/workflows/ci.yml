name: CI

# The publishing workflows run on tags and on a schedule, so this is what covers
# ordinary pushes. A --locked build here surfaces lockfile drift at the commit
# that introduces it: Cargo.lock had been missing 9 packages, including
# clap_derive, which src/main.rs requires via #[derive(Parser)].

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # LBUG_VERSION pins the engine archive the lbug build script
      # downloads; keep it equal to the lbug crate version in Cargo.toml
      # and move it whenever that version changes.
      LBUG_VERSION: '0.22.3'
    strategy:
      fail-fast: false
      matrix:
        # One runner per way this build can differ:
        #   ubuntu  - the cheap gate for lockfile and compile breakage, and the
        #             only target where OpenSSL is vendored.
        #   windows - MSVC and the CMake/Ninja assumptions, plus the 4 GiB
        #             static-library limit that decides debug vs release.
        #             OpenSSL is vendored here too: lbug 0.22.3 hard-links it.
        #   macos   - Clang and libc++ rather than GCC or MSVC, and the other
        #             side of the OpenSSL target gate (Security.framework).
        #             macos-15 is arm64, a standard runner, free on a public
        #             repository. x64 macs were dropped 2026-09: ort rc.13
        #             ships no prebuilt ONNX Runtime for x86_64-apple-darwin,
        #             and every fastembed >= 5 pins that ort.
        os: [ubuntu-latest, windows-latest, macos-15]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version

      # lbug (LadybugDB) compiles a C++ core with CMake. Any 3.15+ works,
      # including the CMake 4 the macOS image ships -- verified by building the
      # whole tree against 4.3.1 with no policy override.
      - name: Verify build prerequisites
        shell: bash
        run: |
          cmake --version || {
            echo "::error::CMake is required to build lbug (LadybugDB) but was not found on this runner."
            exit 1
          }

      # The vendored OpenSSL build (needed by lbug's link directives) requires
      # a Perl with Windows module support: the Git-bundled perl that wins PATH
      # exits 2 during Configure. Strawberry Perl is preinstalled on the image;
      # point openssl-src at it explicitly. NASM is also preinstalled but not
      # always on PATH.
      - name: Configure vendored OpenSSL build (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
          echo "C:/Program Files/NASM" >> "$GITHUB_PATH"

      # src/task/harness_plugins.rs embeds plugins/opencode/dist/index.js with
      # include_str!, and the dist/ bundle is tracked in the repo, so the
      # bundle is present on a fresh checkout and no plugin build is needed
      # before the guard and the compile.

      # Diagnostic only: fails in seconds, before cargo compiles, if
      # any include_str! target is missing from the checkout. Passing
      # here is not acceptance — a persisting local dist/ would also
      # pass; only a fresh-checkout CI run proves the bundle is tracked.
      - name: Guard include_str targets
        shell: bash
        run: bash scripts/check-include-str-targets.sh

      - name: Build
        shell: bash
        run: cargo build --release --locked

      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=target/release/neurostrata-mcp.exe
          else
            BIN=target/release/neurostrata-mcp
          fi
          "$BIN" --version

      # The binary reports CARGO_PKG_VERSION. If someone reintroduces a
      # hardcoded string in the clap attribute, this catches it.
      - name: Version matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=target/release/neurostrata-mcp.exe
          else
            BIN=target/release/neurostrata-mcp
          fi
          expected="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          reported="$("$BIN" --version | tr -d '\r' | awk '{print $NF}')"
          echo "Cargo.toml=$expected  binary=$reported"
          if [ "$expected" != "$reported" ]; then
            echo "::error::Binary reports '$reported' but Cargo.toml says '$expected'."
            exit 1
          fi

  # The build job proves compilation; this proves behavior. Single test
  # thread because the suite's per-test temp databases exhaust the mmap
  # budget when run in parallel (intermittent "Mmap for size ... failed").
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    env:
      # LBUG_VERSION pins the engine archive the lbug build script
      # downloads; keep it equal to the lbug crate version in Cargo.toml
      # and move it whenever that version changes.
      LBUG_VERSION: '0.22.3'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Verify build prerequisites
        shell: bash
        run: |
          cmake --version || {
            echo "::error::CMake is required to build lbug (LadybugDB) but was not found on this runner."
            exit 1
          }

      # The tracked plugin bundles now provide the include_str! target on a
      # fresh checkout, so no plugin build is needed here (see the build job
      # for the rationale).

      # Diagnostic only, as in the build job: fails in seconds, before
      # cargo compiles, if any include_str! target is missing from the
      # checkout. A local pass is not acceptance; only a fresh-checkout
      # CI run proves the bundle is tracked.
      - name: Guard include_str targets
        shell: bash
        run: bash scripts/check-include-str-targets.sh

      # elan is fetched by commit, not by "master": the install script is
      # what decides which toolchain gets downloaded onto the runner, so it
      # is verified before it runs.
      #   leanprover/elan v4.2.4 = commit 227caca133724d5516bee25c2aeb3e609478f2d8
      #   elan-init.sh sha256 = a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
      - name: Install Lean 4 toolchain (elan)
        shell: bash
        run: |
          set -euo pipefail
          ELAN_COMMIT=227caca133724d5516bee25c2aeb3e609478f2d8
          ELAN_SHA256=a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
          ELAN_SCRIPT="$RUNNER_TEMP/elan-init.sh"
          curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/${ELAN_COMMIT}/elan-init.sh" -o "$ELAN_SCRIPT"
          echo "${ELAN_SHA256}  ${ELAN_SCRIPT}" | sha256sum -c -
          sh "$ELAN_SCRIPT" -y --default-toolchain "$(tr -d '[:space:]' < proofs/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --dir proofs build

      - name: Install and run Kani Rust Verifier (formal_kernel.rs)
        shell: bash
        run: |
          set -euo pipefail
          KANI_VER="0.68.0"
          mkdir -p "$HOME/.kani" "$HOME/.cargo/bin"
          rm -rf "$HOME/.kani/kani-${KANI_VER}"
          curl -sSL "https://github.com/model-checking/kani/releases/download/kani-${KANI_VER}/kani-${KANI_VER}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.kani"
          KANI_TC="$(tr -d '[:space:]' < "$HOME/.kani/kani-${KANI_VER}/rust-toolchain-version")"
          rustup toolchain install "$KANI_TC" --profile minimal --component rust-src
          TC_LIB="$HOME/.rustup/toolchains/${KANI_TC}/lib"
          printf '#!/usr/bin/env bash\nexport LD_LIBRARY_PATH="%s:${LD_LIBRARY_PATH:-}"\nexport PATH="$HOME/.kani/kani-%s/bin:$PATH"\nexec "$HOME/.kani/kani-%s/bin/kani-driver" "$@"\n' "$TC_LIB" "$KANI_VER" "$KANI_VER" > "$HOME/.cargo/bin/kani"
          chmod +x "$HOME/.cargo/bin/kani"
          # End-to-end smoke: exercises the wrapper, the driver, and goto-cc
          # before the full harness module runs.
          printf '#[kani::proof]\nfn smoke() { assert!(1 + 1 == 2); }\n' > /tmp/kani-smoke.rs
          kani /tmp/kani-smoke.rs
          NEUROSTRATA_REQUIRE_KANI=1 bash proofs/scripts/extract-aeneas.sh

      - name: Test
        shell: bash
        run: cargo test --locked -- --test-threads=1

      # The wasm crate is path-locked to the same workspace but builds its own
      # dep set (wasm-bindgen, tracing); run its unit tests explicitly so a
      # broken --locked resolution or a wasm-only test regression fails CI.
      - name: Test wasm crate
        shell: bash
        run: cargo test -p neurostrata-wasm --locked -- --test-threads=1

      # The self-test runs the binary tests, so it belongs where the target is
      # already built rather than in a fresh job that would compile it again.
      - name: Remediation eval self-test
        shell: bash
        run: bash scripts/test-remediation-eval.sh

  # Full binary suite on the other two platforms, report-only: a platform
  # regression shows up on the PR without blocking the merge on a runner this
  # project cannot reproduce locally. The ubuntu test job above is the gate.
  test-report:
    name: test (${{ matrix.os }}, report-only)
    runs-on: ${{ matrix.os }}
    env:
      LBUG_VERSION: '0.22.3'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Verify build prerequisites
        shell: bash
        run: |
          cmake --version || {
            echo "::error::CMake is required to build lbug (LadybugDB) but was not found on this runner."
            exit 1
          }

      - name: Configure vendored OpenSSL build (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
          echo "C:/Program Files/NASM" >> "$GITHUB_PATH"

      - name: Guard include_str targets
        shell: bash
        run: bash scripts/check-include-str-targets.sh

      # Release profile: the Windows debug static library exceeds the 4 GiB
      # limit this project already works around in the build job.
      #
      # Report-only is a step-level continue-on-error: a job-level one is not
      # a GitHub Actions feature, and without this a platform failure would
      # turn the check red on every PR even though the ubuntu gate decides.
      - name: Test (report-only)
        id: platform_tests
        continue-on-error: true
        shell: bash
        run: cargo test --release --locked --bin neurostrata-mcp -- --test-threads=1

      - name: Report platform test outcome
        if: steps.platform_tests.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::${{ matrix.os }} test suite failed; this leg is report-only and the ubuntu gate decides"

  # The harness plugin is JavaScript the Rust binary embeds and runs. Its suite
  # includes the restricted-PATH hook tests, which only execute on Windows when
  # Git Bash is present -- a GitHub Windows runner has it. Run the suite on both
  # so that path is covered rather than skipped by the ubuntu-only gate.
  plugins:
    name: plugins (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node version
        shell: bash
        run: node --version

      # From the repository root: the suite resolves plugins/... and
      # scripts/... relative to the working directory.
      - name: Test
        shell: bash
        run: node --test plugins/core/test.mjs

  # The backup script's sidecar/WAL carry and pruning are shell behavior, not
  # Rust behavior; test them where they run.
  scripts:
    name: scripts (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Backup script tests
        shell: bash
        run: bash scripts/test-backup.sh

      - name: Gate receipt self-test
        shell: bash
        run: bash scripts/test-gate-receipt.sh

      - name: Gate receipt live-path harness
        shell: bash
        run: bash scripts/test-gate-receipt-live.sh

      # The disk-hygiene script is shell behaviour too: it deletes things, so
      # its self-test runs against copies of the fixtures, never against the
      # runner's real filesystem.
      - name: Disk hygiene self-test
        shell: bash
        run: bash scripts/test-disk-hygiene.sh

      - name: Main ruleset specification self-test
        shell: bash
        run: bash scripts/test-main-ruleset.sh

  # The staged-quality gate is a local pre-commit path. These tests keep the
  # gate honest, and a shell-only run exercises it server-side so `--no-verify`
  # cannot bypass shell syntax/lint checks.
  staged-quality:
    name: staged-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Gate fixture tests
        shell: bash
        run: bash scripts/test-staged-quality.sh

      - name: Clippy filter tests
        shell: bash
        run: node --test scripts/test-clippy-staged-diagnostics.mjs

      - name: Gate changed shell files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base_sha"

          changed=$(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- '*.sh' 'scripts/hooks/*')
          if [ -z "$changed" ]; then
            echo "no changed shell files"
            exit 0
          fi

          # `git add` in the PR checkout is a no-op: the index already matches
          # HEAD, so the gate would see an empty diff. Stage the PR versions
          # against the base commit in a disposable worktree instead.
          orig="$PWD"
          tmp=$(mktemp -d)
          cleanup() {
            cd "$orig"
            git worktree remove --force "$tmp/wt" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          git worktree add --detach "$tmp/wt" "$base_sha"

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue
            mkdir -p "$tmp/wt/$(dirname "$file")"
            cp -p "$file" "$tmp/wt/$file"
          done <<< "$changed"

          # Exercise the PR's gate implementation, not the base one.
          cp scripts/check-staged-quality.sh "$tmp/wt/scripts/check-staged-quality.sh"
          cp scripts/clippy-staged-diagnostics.mjs "$tmp/wt/scripts/clippy-staged-diagnostics.mjs"

          cd "$tmp/wt"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] && git add -- "$file"
          done <<< "$changed"
          bash scripts/check-staged-quality.sh

  # The dependency graph carries known advisories, so the audit is a gate
  # rather than a report: cargo-audit fails the job on any vulnerability that
  # is not in the dated exception list in .cargo/audit.toml. The tool version
  # is pinned so a new release cannot change the verdict on an old commit.
  audit:
    name: audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        shell: bash
        run: cargo install cargo-audit --version 0.22.1 --locked

      # cargo-audit reads the project configuration from .cargo/audit.toml,
      # which is why this runs from the repository root.
      - name: Audit dependencies
        shell: bash
        run: cargo audit

  # The release narrative names MCP tools, daemon routes, CLI subcommands and
  # in-tree files. A name that never shipped is a user-facing failure, so the
  # current release section and its release note are resolved against the
  # source registries on every PR. See scripts/check-release-references.sh.
  release-references:
    name: release references
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-test the release-reference check
        shell: bash
        run: bash scripts/check-release-references.test.sh

      - name: Validate release-narrative references
        shell: bash
        run: bash scripts/check-release-references.sh
