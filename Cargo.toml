[package]
name = "neurostrata-mcp"
version = "1.3.0"
edition = "2021"

[[bin]]
name = "neurostrata-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
anyhow = "1.0"
fastembed = { version = "7", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
] }
tracing = "0.1"

futures = "0.3.34"
dirs = "7.0.0"
toml = "1.1.6"
dunce = "1"
uuid = { version = "1.26", features = ["v4"] }
chrono = "0.4.45"
tree-sitter = "0.26.8"
ignore = "0.4.33"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
regex = "1.13"
cxx = "=1.0.138"
lbug = "0.20.4"
axum = "0.8"
reqwest = { version = "0.13", features = ["json"] }

# native-tls (pulled in by reqwest, ureq and hf-hub) only links OpenSSL on
# platforms without a system TLS stack. Windows uses SChannel and Apple targets
# use Security.framework, so vendoring OpenSSL there compiles it from source for
# nothing -- and on Windows that build additionally needs Perl and NASM.
# This condition mirrors native-tls's own target gate.
[target.'cfg(not(any(target_os = "windows", target_vendor = "apple")))'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[build-dependencies]
cxx-build = "=1.0.138"
