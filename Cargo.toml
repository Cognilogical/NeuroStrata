[package]
name = "neurostrata-mcp"
version = "1.14.3"
edition = "2021"

[[bin]]
name = "neurostrata-mcp"
path = "src/main.rs"

# The context DTO contract lives in its own integration test target: the
# crate ships a binary only, so the test compiles the module from its real
# source path instead of importing a library that does not exist.
[[test]]
name = "context_model_test"
path = "tests/context/model_test.rs"


# Task 2: shared context service contract. Compiles the crate-free context
# modules from their real paths (see the file's module comment).
[[test]]
name = "context_service_test"
path = "tests/context/service_test.rs"


[[test]]
name = "context_freshness_test"
path = "tests/context/freshness_test.rs"

# Task 5: source/generation-scoped staged ingestion contract. Compiles the
# id/hash helpers from their real path (see the file's module comment) because
# the crate ships a binary target only.
[[test]]
name = "staged_publication_test"
path = "tests/ingest/staged_publication_test.rs"

# Task 3: graph-read ranking contract. Compiles the crate-free
# graph_read::memories_for_file module from its real path (see the file's
# module comment) because the crate ships a binary target only.
[[test]]
name = "memories_for_file_test"
path = "tests/graph_read/memories_for_file_test.rs"

# Task 4: bounded `related` traversal contract. Compiles the crate-free
# graph_read::related module from its real path (see the file's module comment).
[[test]]
name = "related_test"
path = "tests/graph_read/related_test.rs"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
anyhow = "1.0"
fastembed = { version = "7", default-features = false, features = [
    "ort-download-binaries-rustls-tls",
    "hf-hub-rustls-tls",
] }
tracing = "0.1"

futures = "0.3.34"
dirs = "7.0.0"
toml = "1.1.6"
dunce = "1"
uuid = { version = "1.26", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tree-sitter = "0.26.8"
ignore = "0.4.33"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
regex = "1.13"
cxx = "=1.0.138"
lbug = "0.20.4"
arc-swap = "1"
axum = "0.8"
reqwest = { version = "0.13", features = ["json", "blocking"] }
# The crash breadcrumb needs the signal and file syscalls directly; it was
# already in the tree as a transitive dependency, so this adds no download.
libc = "0.2"
sha2 = "0.10"
hex = "0.4"

# native-tls (pulled in by reqwest, ureq and hf-hub) only needs OpenSSL on
# platforms without a system TLS stack: Windows uses SChannel and Apple targets
# use Security.framework, so vendoring OpenSSL there would compile it from
# source for nothing -- and on Windows that build additionally needs Perl and
# NASM. This condition mirrors native-tls's own target gate.
#
# Except: lbug 0.20.4's build script unconditionally emits link directives for
# libssl/libcrypto on every target (its C++ core hard-requires OpenSSL), so
# Windows now needs a vendored build to satisfy the linker. Apple targets keep
# the system-path resolution that already works.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[build-dependencies]
cxx-build = "=1.0.138"

[features]
default = []
learning-laya = []
gliner = []


[[test]]
name = "v8_decision_test"
path = "tests/vocabulary/v8_decision_test.rs"



[[test]]
name = "receipt_test"
path = "tests/receipts/receipt_test.rs"


[[test]]
name = "egress_test"
path = "tests/privacy/egress_test.rs"


[[test]]
name = "upgraded_search_test"
path = "tests/search/upgraded_search_test.rs"


[[test]]
name = "validator_test"
path = "tests/guard/validator_test.rs"
