[package]
name = "ontobug"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[features]
default = []
cli = ["dep:clap"]

[dependencies]
oxigraph = { version = "0.5.11", default-features = false }
oxrdf = "0.3.4"
oxrdfio = "0.2.6"
oxsdatatypes = "0.2.3"
sha2 = "0.10"
thiserror = "2"
rudof_rdf = "0.3.21"
rudof_iri = "0.3.21"
shacl = "0.3.21"
shex_ast = "0.3.21"
shex_validation = "0.3.21"
clap = { version = "4", features = ["derive", "env"], optional = true }
lbug = "0.22.3"
serde_json = "1"

[dev-dependencies]
tempfile = "3"